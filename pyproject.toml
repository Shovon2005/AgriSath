[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agrisathi"
version = "1.0.0"
description = "Explainable AI-Driven Intelligent Decision Support Platform for Precision Agriculture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "shap>=0.44.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["agrisathi*"]
