<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Error | AgriSathi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .error-container {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        .error-icon {
            font-size: 60px;
            color: #f57c00;
            margin-bottom: 15px;
        }
        .error-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2>Notice</h2>
        <p>{{ error_message or "An issue occurred while processing the request." }}</p>
        <a href="/" class="error-btn"><i class="fa-solid fa-arrow-left"></i> Go Back to Input Form</a>
    </div>
</body>
</html>
